name: Refresh Telegram-enabled build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh site from verified private build
        env:
          SOURCE_SHA: "4c6572bfcdb74a8eabd2501fbb3ef05140374e2d"
          DIST_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-190c-8210-a77d-22b48e72057e/raw?se=2026-10-03T11%3A31%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=fb9ffc46-d27b-57a2-91ab-3782dd82e631&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T06%3A05%3A26Z&ske=2026-10-04T06%3A05%3A26Z&sks=b&skv=2026-02-06&sig=Z%2Bp138rs6diibBdMuainFiPv/bb7929B0nLFJkADbmM%3D"
        run: |
          set -euo pipefail
          if [ -f site/.source-sha ] && [ "$(cat site/.source-sha)" = "$SOURCE_SHA" ]; then
            echo "Public site is already current."
            exit 0
          fi
          curl -L --fail --retry 3 "$DIST_URL" -o /tmp/andrea-calendar.zip
          rm -rf site
          mkdir -p site
          unzip -q /tmp/andrea-calendar.zip -d site
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          printf '%s' "$SOURCE_SHA" > site/.source-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "deploy: enable live Telegram relay"
          git push
