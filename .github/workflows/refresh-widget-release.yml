name: Refresh widget release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh compiled site
        env:
          SOURCE_SHA: "20cb25fb79a82ccfd0b00d19c6424855cf733966"
          DIST_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-94e8-8230-853a-5d31712b476c/raw?se=2026-10-06T14%3A34%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=3e8c9a00-7dca-5327-9d7e-5aef3fc4f379&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-06T06%3A21%3A28Z&ske=2026-10-07T06%3A21%3A28Z&sks=b&skv=2026-02-06&sig=D3leBfVt6T0sOWwWup28LfeZVn%2BJeVhangRgClaKBAY%3D"
        run: |
          set -euo pipefail
          if [ -f site/.source-sha ] && [ "$(cat site/.source-sha)" = "$SOURCE_SHA" ]; then
            echo "Public site is already current."
            exit 0
          fi
          curl -L --fail --retry 3 "$DIST_URL" -o /tmp/andrea-calendar.zip
          rm -rf site
          mkdir -p site
          unzip -q /tmp/andrea-calendar.zip -d site
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          test -f site/scriptable/AndreaCalendarWidget.js
          if find site -type f -name '*.map' | grep -q .; then
            echo "Source maps must not be published."
            exit 1
          fi
          printf '%s' "$SOURCE_SHA" > site/.source-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "deploy: publish protected calendar widget"
          git push
