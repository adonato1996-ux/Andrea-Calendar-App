name: Refresh reminder grace build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh compiled site
        env:
          SOURCE_SHA: "1e52d7e5e35fb24dcbf69a861bc79e74ab55b4c5"
          DIST_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-a160-8210-93e1-c490c6b97364/raw?se=2026-10-04T08%3A47%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=d9eb1859-c344-5b2e-ab93-42e4128651d5&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-04T05%3A53%3A21Z&ske=2026-10-05T05%3A53%3A21Z&sks=b&skv=2026-02-06&sig=wmjVyXaFoQNl7ikvfecbOw6FRYlO3dtI3vkY2gEIWjs%3D"
        run: |
          set -euo pipefail
          if [ -f site/.source-sha ] && [ "$(cat site/.source-sha)" = "$SOURCE_SHA" ]; then
            echo "Public site is already current."
            exit 0
          fi
          curl -L --fail --retry 3 "$DIST_URL" -o /tmp/andrea-calendar.zip
          rm -rf site
          mkdir -p site
          unzip -q /tmp/andrea-calendar.zip -d site
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          if find site -type f -name '*.map' | grep -q .; then
            echo "Source maps must not be published."
            exit 1
          fi
          printf '%s' "$SOURCE_SHA" > site/.source-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "deploy: preserve due reminders until delivery"
          git push
