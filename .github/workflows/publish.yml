name: Publish Andrea Calendar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Materialize compiled app
        if: ${{ hashFiles('site/index.html') == '' }}
        env:
          DIST_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-fb54-8210-bc7a-3c4fc3468bab/raw?se=2026-10-02T14%3A19%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=400a15eb-e87b-5aeb-b3c7-1377ec56a04d&skoid=d294dba5-36f7-432b-aab8-935656489847&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T08%3A23%3A09Z&ske=2026-10-03T08%3A23%3A09Z&sks=b&skv=2026-02-06&sig=6iOKs5PROntPJlfDK82ZaVDURQuI0k1%2BiE2YrhiJqqs%3D"
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$DIST_URL" -o /tmp/andrea-calendar.zip
          rm -rf site
          mkdir -p site
          unzip -q /tmp/andrea-calendar.zip -d site
          test -f site/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "deploy: add compiled Andrea Calendar app"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
